name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:check
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/aube-ci.yml@e802c1e932579d1e840f6dd4f8316458d1f96983 # v4
    with:
      # `npm run check` is the repo's full gate (tsc, oxlint, oxfmt, knip, fallow, node tests).
      run-lint: false
      run-test: true
      test-script: check
