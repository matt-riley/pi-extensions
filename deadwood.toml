# Dead-code scan configuration. The CLI counterpart to .fallowrc.json: neither
# tool can see pi's extension manifest, so the entries and the host-provided
# modules are declared here instead of being re-guessed per run.
#
# Run with `deadwood . --fail-on high`; scripts/registration.mjs imports each
# manifest path at runtime, so a run still reports incomplete analysis (exit 2)
# rather than a clean verdict. See docs/verification.md.
entries = ["packages/*/index.ts", "scripts/**/*.mjs"]

ignore_dependencies = [
  # Provided by the pi host at runtime and typed by types/pi-coding-agent.d.ts;
  # this repo deliberately has no dependency on the packages (AGENTS.md).
  "@earendil-works/pi-coding-agent",
  "@earendil-works/pi-tui",
  # deadwood 0.1.2 does not recognise this Node builtin and calls it unlisted.
  "node:async_hooks",
]

# mkdir runs in the coverage script and comes from the OS, not package.json.
ignore_binaries = ["mkdir"]
